name: BITE
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BITE:
    type: application
    platform: iOS
    sources:
      - path: BITE
        excludes: [Info.plist, simple_recipes.json, Assets.xcassets]
      - path: BITE/simple_recipes.json
        buildPhase: resources
      - path: BITE/Assets.xcassets
        buildPhase: resources
    info:
      path: BITE/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BITE
    dependencies: []
